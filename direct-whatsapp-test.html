<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direct WhatsApp Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .test-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn {
            background: #25d366;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 0;
            display: block;
            width: 100%;
        }
        .btn:hover {
            background: #128c7e;
        }
        .debug {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin: 15px 0;
            font-family: monospace;
            font-size: 12px;
            white-space: pre-wrap;
        }
        .success {
            background: #d4edda;
            color: #155724;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>📱 Direct WhatsApp Test</h1>
        <p>Test WhatsApp message to +91 98664 06807</p>
        
        <button class="btn" onclick="testDirectWhatsApp()">
            📱 Send Test WhatsApp Message
        </button>
        
        <button class="btn" onclick="testOrderWhatsApp()">
            📦 Send Test Order WhatsApp
        </button>
        
        <button class="btn" onclick="testPaymentWhatsApp()">
            💳 Send Test Payment WhatsApp
        </button>
        
        <div id="debug" class="debug">Debug information will appear here...</div>
        
        <div id="status"></div>
    </div>

    <script>
        function updateDebug(message) {
            const debug = document.getElementById('debug');
            debug.textContent += new Date().toLocaleTimeString() + ': ' + message + '\n';
            console.log(message);
        }
        
        function updateStatus(message, type = 'info') {
            const status = document.getElementById('status');
            status.innerHTML = `<div class="${type}">${message}</div>`;
        }
        
        function testDirectWhatsApp() {
            updateDebug('Testing direct WhatsApp...');
            
            const phoneNumber = '+91 98664 06807';
            const cleanPhone = phoneNumber.replace(/[^\d]/g, '');
            const message = 'Hello! This is a test message from SRIDEVI HOME FOODS website.';
            const whatsappUrl = `https://wa.me/${cleanPhone}?text=${encodeURIComponent(message)}`;
            
            updateDebug(`Phone: ${phoneNumber}`);
            updateDebug(`Clean Phone: ${cleanPhone}`);
            updateDebug(`Message: ${message}`);
            updateDebug(`URL: ${whatsappUrl}`);
            
            // Test URL
            updateDebug('Opening WhatsApp...');
            window.open(whatsappUrl, '_blank');
            
            updateStatus('✅ WhatsApp opened successfully!', 'success');
        }
        
        function testOrderWhatsApp() {
            updateDebug('Testing order WhatsApp...');
            
            const phoneNumber = '+91 98664 06807';
            const cleanPhone = phoneNumber.replace(/[^\d]/g, '');
            
            const orderMessage = `📋 NEW ORDER - SRIDEVI HOME FOODS

Customer: Test Customer
Phone: +91 98664 06807
Email: test@example.com
Address: 123 Test Street, Andhra Pradesh

Order Items:
• Sakinalu x 2 = ₹300
• Garelu x 1 = ₹120

Total: ₹420

Status: Pending
Date: ${new Date().toLocaleString('en-IN')}

Please confirm this order! 🙏`;
            
            const whatsappUrl = `https://wa.me/${cleanPhone}?text=${encodeURIComponent(orderMessage)}`;
            
            updateDebug(`Phone: ${phoneNumber}`);
            updateDebug(`Clean Phone: ${cleanPhone}`);
            updateDebug(`Message Length: ${orderMessage.length}`);
            updateDebug(`URL: ${whatsappUrl}`);
            
            updateDebug('Opening WhatsApp with order...');
            window.open(whatsappUrl, '_blank');
            
            updateStatus('✅ Order WhatsApp opened successfully!', 'success');
        }
        
        function testPaymentWhatsApp() {
            updateDebug('Testing payment WhatsApp...');
            
            const phoneNumber = '+91 98664 06807';
            const cleanPhone = phoneNumber.replace(/[^\d]/g, '');
            
            const paymentMessage = `✅ PAYMENT CONFIRMED - SRIDEVI HOME FOODS

💳 PAYMENT DETAILS:
Payment Method: UPI
Transaction ID: TEST123456789
Amount Paid: ₹420

📋 ORDER DETAILS:
• Sakinalu x 2 = ₹300
• Garelu x 1 = ₹120

💰 Total Amount: ₹420

👤 CUSTOMER DETAILS:
Name: Test Customer
Phone: +91 98664 06807
Email: test@example.com
Address: 123 Test Street, Andhra Pradesh

✅ Status: PAID
Date: ${new Date().toLocaleString('en-IN')}

Thank you for your order! 🙏
Your order will be delivered soon! 🚚`;
            
            const whatsappUrl = `https://wa.me/${cleanPhone}?text=${encodeURIComponent(paymentMessage)}`;
            
            updateDebug(`Phone: ${phoneNumber}`);
            updateDebug(`Clean Phone: ${cleanPhone}`);
            updateDebug(`Message Length: ${paymentMessage.length}`);
            updateDebug(`URL: ${whatsappUrl}`);
            
            updateDebug('Opening WhatsApp with payment confirmation...');
            window.open(whatsappUrl, '_blank');
            
            updateStatus('✅ Payment WhatsApp opened successfully!', 'success');
        }
        
        // Auto-clear debug on load
        window.onload = function() {
            document.getElementById('debug').textContent = 'Debug information will appear here...\n\n';
        };
    </script>
</body>
</html>
